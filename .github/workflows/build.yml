name: Build Fgithub CLI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MinGW
        shell: powershell
        run: |
          choco install mingw -y --no-progress
          refreshenv
          gcc --version

      - name: Build
        shell: powershell
        run: |
          gcc -O2 -std=c11 .\fgh.c -o .\fgh.exe -lwinhttp -lcrypt32 -lshell32
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Verify
        shell: powershell
        run: |
          .\fgh.exe --version

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Fgithub-CLI-Windows-x64
          path: fgh.exe
