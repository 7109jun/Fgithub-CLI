name: Build Fgithub CLI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc

      - name: Check GCC
        shell: msys2 {0}
        run: |
          gcc --version
          which gcc

      - name: Build
        shell: msys2 {0}
        run: |
          gcc -O2 -std=c11 -Wall -Wextra \
            -D_CRT_SECURE_NO_WARNINGS \
            -o fgh.exe fgh.c \
            -lwinhttp -lcrypt32 -lshell32

      - name: Verify
        shell: msys2 {0}
        run: |
          file fgh.exe
          ./fgh.exe --version

      - name: Upload fgh.exe
        uses: actions/upload-artifact@v4
        with:
          name: Fgithub-CLI-Windows-x64
          path: fgh.exe
